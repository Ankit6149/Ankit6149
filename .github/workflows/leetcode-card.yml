name: Refresh LeetCode cards

on:
  push:
    branches:
      - main
    paths:
      - tools/generate_leetcode_card.py
      - .github/workflows/leetcode-card.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh theme-aware card assets
        run: python tools/generate_leetcode_card.py --username ankit_bh_ --light-output assets/leetcode-card-light.svg --dark-output assets/leetcode-card-dark.svg

      - name: Commit refreshed card assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-card-light.svg assets/leetcode-card-dark.svg
          git diff --cached --quiet || (git commit -m "Refresh theme-aware LeetCode cards [skip ci]" && git push)
