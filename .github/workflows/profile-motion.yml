name: Render profile motion

on:
  push:
    branches:
      - main
    paths:
      - tools/generate_profile_motion.py
      - .github/workflows/profile-motion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        run: pip install pillow numpy opencv-python-headless

      - name: Fetch ASCILINE
        run: git clone --depth 1 https://github.com/YusufB5/ASCILINE.git .asciline

      - name: Render theme-aware profile films
        run: |
          python tools/generate_profile_motion.py \
            --asciline .asciline \
            --light-output assets/ankit-cinematic-ascii-light.gif \
            --dark-output assets/ankit-cinematic-ascii-dark.gif

      - name: Commit generated animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ankit-cinematic-ascii-light.gif assets/ankit-cinematic-ascii-dark.gif
          if git diff --cached --quiet; then
            echo "Animations are already current."
          else
            git commit -m "Render theme-aware profile animations [skip ci]"
            git push
          fi
