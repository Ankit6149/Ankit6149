<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Animated profile banner for Ankit Bhardwaj</title>
  <desc id="desc">A compact dark professional banner with Ankit Bhardwaj's name and rotating engineering roles.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2a2926" stroke-width="1" opacity="0.42"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7c7aa" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#57534b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d7c7aa" stop-opacity="0.32"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="1" y="1" width="958" height="218" rx="20"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="958" height="218" rx="20" fill="#111110" stroke="url(#edge)" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect width="960" height="220" fill="url(#grid)" opacity="0.52"/>
    <rect x="-180" y="0" width="180" height="220" fill="#d7c7aa" opacity="0.025">
      <animate attributeName="x" values="-180;960" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="38" cy="34" r="4" fill="#d7c7aa">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="54" y="40" fill="#8f8b82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.8">ANKIT / ACTIVE</text>

  <text x="36" y="108" fill="#f0ece2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="1.2">ANKIT BHARDWAJ</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#d7c7aa">
    <text x="39" y="154" opacity="0">&gt; FULL-STACK ENGINEER
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.29;0.33;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="39" y="154" opacity="0">&gt; AI + AUTOMATION BUILDER
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.62;0.66;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="39" y="154" opacity="0">&gt; LOCAL-FIRST PRODUCT THINKER
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.69;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <rect x="391" y="135" width="10" height="23" rx="1" fill="#d7c7aa">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="38" y="191" fill="#8f8b82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="0.8">software • systems • research • products</text>
  <rect x="38" y="204" width="0" height="2" rx="1" fill="#d7c7aa" opacity="0.8">
    <animate attributeName="width" values="0;884;884;0" keyTimes="0;0.72;0.92;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
