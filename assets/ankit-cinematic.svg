<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Ankit Bhardwaj cinematic profile</title><desc id="d">A looping cinematic sequence about software engineering, automation, applied AI and published research.</desc>
<defs>
